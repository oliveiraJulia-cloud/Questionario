<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Respostas — Painel</title>
<meta name="theme-color" content="#0F1218">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1218;
    --panel:#171B24;
    --panel-2:#1D222D;
    --line:#2A2F3B;
    --text:#E9ECF3;
    --text-dim:#9AA1B2;
    --accent:#4FD1C5;
    --accent-dim:#2E8F86;
    --accent-2:#8B7FE0;
    --danger:#F97066;
    --mono:'JetBrains Mono', monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(79,209,197,0.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(139,127,224,0.08), transparent 45%),
      var(--ink);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    min-height:100svh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh;
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .login-card{
    width:100%; max-width:360px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6);
  }
  .login-card h1{
    font-family:var(--display); font-size:20px; font-weight:600;
    margin:0 0 6px;
  }
  .login-card p.sub{ color:var(--text-dim); font-size:13.5px; margin:0 0 22px; line-height:1.5; }
  label{ display:block; font-size:13px; font-weight:500; margin:14px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input[type=email], input[type=password]{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px 14px; font-family:var(--body); font-size:15px; outline:none;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,209,197,0.15); }
  button{
    font-family:var(--body); font-weight:600; font-size:14.5px; border-radius:10px;
    padding:12px 20px; border:none; cursor:pointer;
  }
  button:active{ transform:scale(.97); }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#0B0E13; width:100%; margin-top:20px;
  }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .login-error{
    font-family:var(--mono); font-size:12px; color:var(--danger); margin-top:12px; display:none;
  }
  .login-error.show{ display:block; }

  /* ---------- DASHBOARD ---------- */
  .dash{ display:none; max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .dash.active{ display:block; }
  .dash-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px; gap:12px; flex-wrap:wrap;
  }
  .dash-header h1{ font-family:var(--display); font-size:20px; margin:0; }
  .dash-header .count{ color:var(--text-dim); font-size:13px; font-family:var(--mono); }
  .header-actions{ display:flex; gap:8px; }
  .btn-ghost{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
  }
  .btn-ghost:hover{ color:var(--text); border-color:#3D4456; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }

  .response-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:14px; cursor:pointer;
  }
  .response-card .row1{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .response-card .name{ font-size:15.5px; font-weight:600; }
  .response-card .date{ font-size:11.5px; color:var(--text-dim); font-family:var(--mono); white-space:nowrap; }
  .response-card .meta{ font-size:13px; color:var(--text-dim); margin-top:4px; }
  .response-card .details{ display:none; margin-top:16px; border-top:1px solid var(--line); padding-top:14px; }
  .response-card.open .details{ display:block; }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field .k{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-family:var(--mono); margin-bottom:3px; }
  .field .v{ font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .field .v.empty{ color:var(--text-dim); font-style:italic; }

  .delete-row{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
  .btn-delete{
    background:transparent; color:var(--danger); border:1px solid rgba(249,112,102,0.35);
    font-size:13px; padding:9px 16px;
  }
  .btn-delete:hover{ background:rgba(249,112,102,0.1); border-color:var(--danger); }

  .loading{ text-align:center; padding:60px 20px; color:var(--text-dim); font-family:var(--mono); font-size:13px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Painel de respostas</h1>
    <p class="sub">Acesso restrito. Entre com a conta que você cadastrou no Firebase Authentication.</p>
    <form id="loginForm">
      <label>E-mail</label>
      <input type="email" id="loginEmail" required>
      <label>Senha</label>
      <input type="password" id="loginPassword" required>
      <button type="submit" class="btn-primary" id="btnLogin">Entrar</button>
      <div class="login-error" id="loginError">E-mail ou senha incorretos.</div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">
  <div class="dash-header">
    <div>
      <h1>Respostas recebidas</h1>
      <div class="count" id="countLabel">carregando...</div>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" id="btnRefresh">Atualizar</button>
      <button class="btn-ghost" id="btnLogout">Sair</button>
    </div>
  </div>
  <div id="listArea"><div class="loading">Carregando respostas...</div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ======================================================
  // Use os MESMOS dados do firebaseConfig do index.html
  // ======================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDJ_VPLZjEzgNorILFcjUalqrukVCbxr8E",
    authDomain: "questi-7cbe3.firebaseapp.com",
    projectId: "questi-7cbe3",
    storageBucket: "questi-7cbe3.firebasestorage.app",
    messagingSenderId: "597809197109",
    appId: "1:597809197109:web:f321e49f9d513cfb69c17c"
  };

  const NOME_DA_COLECAO = "respostas";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginWrap = document.getElementById("loginWrap");
  const dash = document.getElementById("dash");
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const btnLogin = document.getElementById("btnLogin");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.classList.remove("show");
    btnLogin.disabled = true;
    btnLogin.textContent = "Entrando...";
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("loginEmail").value.trim(),
        document.getElementById("loginPassword").value
      );
    } catch (err) {
      loginError.classList.add("show");
      btnLogin.disabled = false;
      btnLogin.textContent = "Entrar";
    }
  });

  document.getElementById("btnLogout").addEventListener("click", () => signOut(auth));
  document.getElementById("btnRefresh").addEventListener("click", loadResponses);

  onAuthStateChanged(auth, (user) => {
    btnLogin.disabled = false;
    btnLogin.textContent = "Entrar";
    if (user) {
      loginWrap.style.display = "none";
      dash.classList.add("active");
      loadResponses();
    } else {
      loginWrap.style.display = "flex";
      dash.classList.remove("active");
    }
  });

  const FIELD_LABELS = {
    empresa: "Empresa",
    nomeApp: "Nome do aplicativo",
    quemVai: "Quem utilizará",
    quemVaiOutro: "Detalhe (outro)",
    funcionamento: "Como imagina o funcionamento",
    comoUsar: "Online / offline",
    dispositivos: "Dispositivos",
    corPrincipal: "Cor principal",
    referenciaVisual: "Referência visual",
    referenciaApp: "App/site parecido",
    referenciaGosta: "O que gosta nele",
    tipoDados: "Tipo de dados armazenados",
    seguranca: "Login / permissões / senha",
    prazo: "Prazo desejado"
  };

  function formatDate(value){
    try {
      const d = value?.toDate ? value.toDate() : new Date(value);
      return d.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch { return ""; }
  }

  function renderValue(v){
    if(Array.isArray(v)) return v.length ? v.join(", ") : null;
    if(typeof v === "string") return v.trim() ? v.trim() : null;
    return v || null;
  }

  async function loadResponses(){
    const listArea = document.getElementById("listArea");
    const countLabel = document.getElementById("countLabel");
    listArea.innerHTML = '<div class="loading">Carregando respostas...</div>';
    try {
      const q = query(collection(db, NOME_DA_COLECAO), orderBy("criadoEm", "desc"));
      const snap = await getDocs(q);
      countLabel.textContent = snap.size + (snap.size === 1 ? " resposta" : " respostas");

      if(snap.empty){
        listArea.innerHTML = '<div class="empty-state">Nenhuma resposta recebida ainda.</div>';
        return;
      }

      listArea.innerHTML = "";
      snap.forEach(docSnap => {
        const data = docSnap.data();
        const card = document.createElement("div");
        card.className = "response-card";

        const meta = [data.email, data.empresa].filter(Boolean).join(" · ");

        let detailsHtml = "";
        Object.keys(FIELD_LABELS).forEach(key => {
          const val = renderValue(data[key]);
          detailsHtml += `<div class="field"><div class="k">${FIELD_LABELS[key]}</div><div class="v ${val ? "" : "empty"}">${val ? escapeHtml(val) : "não informado"}</div></div>`;
        });

        card.innerHTML = `
          <div class="row1">
            <div class="name">${escapeHtml(data.nome || "Sem nome")}</div>
            <div class="date">${formatDate(data.criadoEm)}</div>
          </div>
          <div class="meta">${escapeHtml(meta || "sem contato adicional")}</div>
          <div class="details">
            ${detailsHtml}
            <div class="delete-row">
              <button type="button" class="btn-delete">Excluir esta resposta</button>
            </div>
          </div>
        `;

        card.addEventListener("click", () => card.classList.toggle("open"));

        const btnDelete = card.querySelector(".btn-delete");
        btnDelete.addEventListener("click", async (e) => {
          e.stopPropagation();
          const confirmed = window.confirm(`Excluir a resposta de "${data.nome || "Sem nome"}"? Essa ação não pode ser desfeita.`);
          if(!confirmed) return;
          btnDelete.disabled = true;
          btnDelete.textContent = "Excluindo...";
          try {
            await deleteDoc(doc(db, NOME_DA_COLECAO, docSnap.id));
            card.remove();
            const remaining = document.querySelectorAll(".response-card").length;
            countLabel.textContent = remaining + (remaining === 1 ? " resposta" : " respostas");
            if(remaining === 0){
              listArea.innerHTML = '<div class="empty-state">Nenhuma resposta recebida ainda.</div>';
            }
          } catch (err) {
            console.error(err);
            btnDelete.disabled = false;
            btnDelete.textContent = "Não foi possível excluir. Tente novamente.";
          }
        });

        listArea.appendChild(card);
      });
    } catch (err) {
      console.error(err);
      listArea.innerHTML = '<div class="empty-state">Não foi possível carregar as respostas. Confira o firebaseConfig e as regras do Firestore.</div>';
    }
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>

</body>
</html>
